name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BubbleCropTool/**'
      - 'BubbleCropTool.xcodeproj/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build (archive, unsigned)
        run: |
          xcodebuild -project BubbleCropTool.xcodeproj \
            -scheme BubbleCropTool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BubbleCropTool.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          APP_PATH="build/BubbleCropTool.xcarchive/Products/Applications/BubbleCropTool.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BubbleCropTool-unsigned.ipa Payload
          ls -lh BubbleCropTool-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BubbleCropTool-unsigned-ipa
          path: BubbleCropTool-unsigned.ipa
          if-no-files-found: error
